<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Bright Future Tuition Classes</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>
<header>
    <div class="logo">Bright Future Tuition Classes</div>
    <nav>
        <a href="registration.html">Registration</a>
        <a href="login.html" class="active">Login</a>
        <a href="process.html">Process</a>
        <a href="feedback.html">Feedback</a>
        <a href="price-details.html">Price Details</a>
    </nav>
</header>

<main class="container">
    <section class="hero">
        <h1>Student Login</h1>
        <p>Access your tuition class account.</p>
    </section>

    <section class="card form-card small-card">
        <h2>Welcome Back!</h2>
        <form action="#" method="post">
            <label for="email">Email Address</label>
            <input type="email" id="email" placeholder="Enter your email" required>

            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Enter your password" required>

            <div class="remember">
                <input type="checkbox" id="remember">
                <label for="remember">Remember me</label>
            </div>

            <button type="submit">Login</button>
            <p class="center-text">New student? <a href="registration.html">Register here</a></p>
        </form>
    </section>
</main>

<footer>
    <p>&copy; 2026 Bright Future Tuition Classes. All Rights Reserved.</p>
    <div class="social-icons">
        <a href="#" aria-label="Facebook"><i class="fab fa-facebook"></i></a>
        <a href="#" aria-label="Instagram"><i class="fab fa-instagram"></i></a>
        <a href="#" aria-label="YouTube"><i class="fab fa-youtube"></i></a>
        <a href="#" aria-label="WhatsApp"><i class="fab fa-whatsapp"></i></a>
    </div>
</footer>
</body>
</html>
