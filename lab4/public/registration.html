<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration | Bright Future Tuition Classes</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>
<header>
    <div class="logo">Bright Future Tuition Classes</div>
    <nav>
        <a href="registration.html" class="active">Registration</a>
        <a href="login.html">Login</a>
        <a href="process.html">Process</a>
        <a href="feedback.html">Feedback</a>
        <a href="price-details.html">Price Details</a>
    </nav>
</header>

<main class="container">
    <section class="hero">
        <h1>Student Registration</h1>
        <p>Join Bright Future Tuition Classes and start learning with confidence.</p>
    </section>

    <section class="card form-card">
        <h2>Create Your Account</h2>
        <form action="#" method="post">
            <label for="name">Full Name</label>
            <input type="text" id="name" name="name" placeholder="Enter your full name" required>

            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" placeholder="Enter your email" required>

            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" name="phone" placeholder="Enter your phone number" required>

            <label for="class">Class</label>
            <select id="class" name="class" required>
                <option value="">Select your class</option>
                <option>Class 6</option>
                <option>Class 7</option>
                <option>Class 8</option>
                <option>Class 9</option>
                <option>Class 10</option>
                <option>Class 11</option>
                <option>Class 12</option>
            </select>

            <label for="subject">Subject</label>
            <select id="subject" name="subject" required>
                <option value="">Select subject</option>
                <option>Mathematics</option>
                <option>Science</option>
                <option>English</option>
                <option>Physics</option>
                <option>Chemistry</option>
                <option>Computer Science</option>
            </select>

            <label for="password">Create Password</label>
            <input type="password" id="password" name="password" placeholder="Create a password" required>

            <button type="submit">Register Now</button>
        </form>
    </section>
</main>

<footer>
    <p>&copy; 2026 Bright Future Tuition Classes. All Rights Reserved.</p>
    <div class="social-icons">
        <a href="#" aria-label="Facebook"><i class="fab fa-facebook"></i></a>
        <a href="#" aria-label="Instagram"><i class="fab fa-instagram"></i></a>
        <a href="#" aria-label="YouTube"><i class="fab fa-youtube"></i></a>
        <a href="#" aria-label="WhatsApp"><i class="fab fa-whatsapp"></i></a>
    </div>
</footer>
</body>
</html>
